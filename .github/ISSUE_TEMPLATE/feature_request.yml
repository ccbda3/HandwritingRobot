name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        提建议前请先看一眼 [系统架构](../blob/main/docs/architecture.md)
        和 [架构决策记录](../tree/main/docs/adr)——
        有些方向我们已经评估过并说明了取舍。

  - type: dropdown
    id: area
    attributes:
      label: 涉及方向
      options:
        - 轨迹生成质量（更像真人手写）
        - 运动约束优化（更顺畅、更少停顿）
        - G 代码 / 硬件兼容
        - 采集体验
        - 桌面 UI
        - 文档 / 工程
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述痛点，而不是直接描述方案。方案可以由问题推出来，反过来不行。
      placeholder: |
        现在写长文本时，笔画之间的空行程很长，写字机来回跑浪费时间。
        希望能在导出前自动优化书写顺序。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的方案
      description: 如果已经有想法，写在这里
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，确认这不是重复建议
          required: true
