<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>开发者模式 · 文章 → 模型排版</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#2a2f3a;--text:#e6e6e6;--dim:#9aa0a6;--accent:#67d4ff;--red:#e5484d}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;display:flex;flex-direction:column}
  header{display:flex;align-items:baseline;gap:14px;padding:13px 20px;border-bottom:1px solid #20242c;flex-shrink:0}
  h1{font-size:16px;font-weight:500;margin:0}
  .sub{color:var(--dim);font-size:12px}
  .status{margin-left:auto;color:var(--dim);font-size:12px}
  main{flex:1;display:grid;grid-template-columns:380px 1fr;min-height:0}
  .left{padding:16px;display:flex;flex-direction:column;gap:11px;border-right:1px solid #20242c;min-height:0}
  textarea{flex:1;min-height:180px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;line-height:1.75;resize:none;outline:none;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  textarea:focus{border-color:var(--accent)}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:12px;color:var(--dim)}
  .field input,.field select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;outline:none}
  .field input:focus,.field select:focus{border-color:var(--accent)}
  .row{display:flex;align-items:center;gap:10px}
  input[type=range]{flex:1;accent-color:var(--accent)}
  button{background:#12303f;color:var(--accent);border:1px solid #1f5a73;border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer}
  button:hover{background:#164054}
  .hint{color:var(--dim);font-size:12px;line-height:1.6}
  .right{overflow:auto;padding:24px;background:#0b0d12}
  .paper{position:relative;width:fit-content;max-width:100%;margin:0 auto;background:#fff;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.55)}
  #svgHost svg{display:block;max-width:100%;height:auto}
  .hits{position:absolute;inset:0}
  .hit{position:absolute;cursor:text;border-radius:3px}
  .hit:hover{outline:1px solid rgba(103,212,255,.55)}
  .hit.active{outline:1.5px solid var(--red);background:rgba(229,72,77,.06)}
  .hit.missing{outline:1px dashed rgba(229,72,77,.55)}
  .cell-editor{position:absolute;display:none;background:transparent;border:0;outline:0;padding:0;margin:0;color:transparent;caret-color:var(--red);text-align:center;line-height:1;z-index:10;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .empty{color:var(--dim);font-size:13px;padding:40px;text-align:center}
  @media (max-width:900px){main{grid-template-columns:1fr;grid-template-rows:45% 55%}}
</style>
</head>
<body>
<header>
  <h1>开发者模式 · 文章 → 模型排版</h1>
  <span class="sub">右侧可直接点字编辑</span>
  <span class="status" id="status">准备中…</span>
</header>
<main>
  <section class="left">
    <textarea id="text" spellcheck="false">春眠不觉晓处处闻啼鸟夜来风雨声花落知多少床前明月光疑是地上霜举头望明月低头思故乡</textarea>
    <div class="controls">
      <div class="field">
        <label>排版</label>
        <select id="mode">
          <option value="grid">网格（自动高度）</option>
          <option value="notebook">横条本（单页）</option>
        </select>
      </div>
      <div class="field">
        <label>字宽（mm）</label>
        <input id="size" type="number" value="10" min="4" max="30" step="1">
      </div>
      <div class="field">
        <label>每行字数</label>
        <input id="cpl" type="number" value="20" min="4" max="60" step="1">
      </div>
      <div class="field">
        <label>页边距（mm）</label>
        <input id="margin" type="number" value="8" min="0" max="30" step="1">
      </div>
    </div>
    <div class="field">
      <label>风格强度 <span id="strengthVal">100%</span></label>
      <div class="row"><input id="strength" type="range" min="0" max="100" step="5" value="100"></div>
    </div>
    <button id="go">重新生成</button>
    <div class="hint">点右侧任意字格出光标，直接输入替换；方向键移动，Enter 换行，Backspace 删字。缺字格是虚线框（字形库没有该字符）。</div>
  </section>
  <section class="right">
    <div class="paper" id="paper">
      <div id="svgHost"><div class="empty">输入文字后自动生成</div></div>
      <div class="hits" id="hits"></div>
      <input id="cellEditor" class="cell-editor" autocomplete="off" spellcheck="false" />
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const isStatic = params.get('static') === '1';

let state = { lines: [], cells: [], pageW: 1, pageH: 1, active: -1 };
let composing = false;
let timer = null;
let pendingCursor = null;

function payload(){
  return {
    text: $('text').value,
    mode: $('mode').value,
    char_size: Number($('size').value),
    chars_per_line: Number($('cpl').value),
    margin: Number($('margin').value),
    strength: Number($('strength').value) / 100
  };
}

async function renderNow(){
  $('status').textContent = '推理中…';
  try{
    const res = await fetch('/render', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload())
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    apply(data);
  }catch(err){
    $('status').textContent = '出错：' + err.message;
  }
}

function apply(data){
  const previous = state.active >= 0 ? state.cells[state.active] : null;
  state.lines = data.wrapped || [];
  state.cells = data.cells || [];
  state.pageW = (data.page && data.page.width) || 1;
  state.pageH = (data.page && data.page.height) || 1;

  $('svgHost').innerHTML = data.svg || '<div class="empty">没有可渲染的字</div>';
  buildHits();

  const miss = data.missing && data.missing.length ? ` · 缺字 ${data.missing.length}` : '';
  const backend = data.backend ? ` · ${data.backend}` : '';
  $('status').textContent =
    `${data.chars} 字 · ${data.lines} 行${miss}${backend} · ${data.width}×${data.height} mm · ${data.elapsed}ms`;

  if(isStatic) return;
  let target = null;
  if(pendingCursor){ target = pendingCursor; pendingCursor = null; }
  else if(previous){ target = {line: previous.line, column: previous.column}; }
  if(target){
    const index = findCell(target.line, target.column);
    if(index >= 0) activate(index, true);
  }
}

function findCell(line, column){
  let best = -1;
  let bestDistance = Infinity;
  state.cells.forEach((cell, index) => {
    if(cell.line !== line) return;
    const distance = Math.abs(cell.column - column);
    if(distance < bestDistance){ bestDistance = distance; best = index; }
  });
  return best;
}

function buildHits(){
  const hits = $('hits');
  hits.innerHTML = '';
  state.cells.forEach((cell, index) => {
    const div = document.createElement('div');
    div.className = 'hit' + (cell.missing ? ' missing' : '');
    div.style.left = (cell.x / state.pageW * 100) + '%';
    div.style.top = (cell.y / state.pageH * 100) + '%';
    div.style.width = (cell.size / state.pageW * 100) + '%';
    div.style.height = (cell.size / state.pageH * 100) + '%';
    div.addEventListener('mousedown', (event) => {
      event.preventDefault();
      activate(index, true);
    });
    hits.appendChild(div);
  });
}

function activate(index, focus){
  const editor = $('cellEditor');
  if(index < 0 || index >= state.cells.length){
    editor.style.display = 'none';
    state.active = -1;
    document.querySelectorAll('.hit').forEach((hit) => hit.classList.remove('active'));
    return;
  }
  state.active = index;
  const cell = state.cells[index];
  const paper = $('paper').getBoundingClientRect();
  editor.style.display = 'block';
  editor.style.left = (cell.x / state.pageW * 100) + '%';
  editor.style.top = (cell.y / state.pageH * 100) + '%';
  editor.style.width = (cell.size / state.pageW * 100) + '%';
  editor.style.height = (cell.size / state.pageH * 100) + '%';
  editor.style.fontSize = Math.max(12, (cell.size / state.pageH) * paper.height * 0.8) + 'px';
  editor.value = cell.char || '';
  document.querySelectorAll('.hit').forEach((hit, i) => hit.classList.toggle('active', i === index));
  if(focus){ editor.focus(); editor.select(); }
}

function syncTextarea(){
  $('text').value = state.lines.join('\n');
}

function schedule(cursor){
  if(cursor) pendingCursor = cursor;
  clearTimeout(timer);
  timer = setTimeout(renderNow, 350);
}

function handleEdit(value){
  if(state.active < 0) return;
  const cell = state.cells[state.active];
  const line = state.lines[cell.line] || '';
  const column = cell.column;
  const chars = Array.from(value);
  const before = line.slice(0, column);
  const after = line.slice(column + 1);
  state.lines[cell.line] = before + chars.join('') + after;
  syncTextarea();
  schedule({line: cell.line, column: column + Math.max(1, chars.length)});
}

function moveVertical(direction){
  const cell = state.cells[state.active];
  if(!cell) return;
  const index = findCell(cell.line + direction, cell.column);
  if(index >= 0) activate(index, true);
}

function splitLine(){
  const cell = state.cells[state.active];
  if(!cell) return;
  const line = state.lines[cell.line] || '';
  const at = Math.min(line.length, cell.column + 1);
  state.lines[cell.line] = line.slice(0, at);
  state.lines.splice(cell.line + 1, 0, line.slice(at));
  syncTextarea();
  schedule({line: cell.line + 1, column: 0});
}

function deletePrevious(){
  if(state.active <= 0) return;
  const previous = state.cells[state.active - 1];
  const line = state.lines[previous.line] || '';
  state.lines[previous.line] =
    line.slice(0, previous.column) + line.slice(previous.column + 1);
  syncTextarea();
  schedule({line: previous.line, column: previous.column});
}

const editor = $('cellEditor');
editor.addEventListener('compositionstart', () => { composing = true; });
editor.addEventListener('compositionend', (event) => {
  composing = false;
  handleEdit(event.target.value);
});
editor.addEventListener('input', (event) => {
  if(!composing) handleEdit(event.target.value);
});
editor.addEventListener('keydown', (event) => {
  if(event.key === 'ArrowRight'){ event.preventDefault(); activate(state.active + 1, true); }
  else if(event.key === 'ArrowLeft'){ event.preventDefault(); activate(state.active - 1, true); }
  else if(event.key === 'ArrowDown'){ event.preventDefault(); moveVertical(1); }
  else if(event.key === 'ArrowUp'){ event.preventDefault(); moveVertical(-1); }
  else if(event.key === 'Enter'){ event.preventDefault(); splitLine(); }
  else if(event.key === 'Backspace' && !editor.value){ event.preventDefault(); deletePrevious(); }
  else if(event.key === 'Escape'){ event.preventDefault(); activate(-1, false); }
});

$('text').addEventListener('input', () => {
  state.active = -1;
  pendingCursor = null;
  schedule(null);
});
['mode','size','cpl','margin'].forEach((id) => {
  $(id).addEventListener('input', () => schedule(null));
});
$('strength').addEventListener('input', () => {
  $('strengthVal').textContent = $('strength').value + '%';
  schedule(null);
});
$('go').onclick = () => schedule(null);

async function selfTest(){
  await renderNow();
  if(!state.cells.length){ document.title = 'SELFTEST FAIL no cells'; return; }
  const before = $('svgHost').innerHTML;
  activate(0, true);
  editor.value = '好';
  editor.dispatchEvent(new Event('input', {bubbles: true}));
  await new Promise((resolve) => setTimeout(resolve, 1600));
  document.title = $('svgHost').innerHTML !== before ? 'SELFTEST OK' : 'SELFTEST FAIL';
}

renderNow();
if(params.get('selftest') === '1') selfTest();
</script>
</body>
</html>
