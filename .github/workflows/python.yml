name: Python

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "benchmarks/python/**"
      - "pyproject.toml"
      - ".github/workflows/python.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests benchmarks/python

      - name: Ruff format 检查
        run: ruff format --check src tests benchmarks/python

      - name: 单元测试
        run: pytest --cov=src/handwriting --cov-report=term-missing

  benchmark:
    name: 性能基线
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: 运行 Python 基准
        run: python benchmarks/python/bench_pipeline.py
