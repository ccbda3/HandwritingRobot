[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "handwriting-robot"
version = "0.1.0"
description = "学习个人笔迹风格，生成带书写时序的笔画轨迹并导出 GRBL G 代码"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["handwriting", "grbl", "gcode", "stroke", "plotter"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "pre-commit>=4.0",
]

[project.scripts]
handwriting = "handwriting.cli:main"

[project.urls]
Homepage = "https://github.com/Whaoy/HandwritingRobot"
Issues = "https://github.com/Whaoy/HandwritingRobot/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/handwriting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
markers = [
  "network: 需要联网的测试，默认跳过（用 --run-network 启用）",
]

[tool.coverage.run]
source = ["src/handwriting"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]
ignore = [
  "E501",    # 行长由 ruff format 统一处理
  "RUF001",  # 中文注释与字符串里的全角标点不构成歧义
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["handwriting"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
